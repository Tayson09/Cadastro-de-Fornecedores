<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063792.png" type="image/x-icon">
    <title>Cadastro de Fornecedores</title>
</head>
<body>
    <h1>Cadastro de Fornecedores</h1>
    <div class="basic-date">
        <h2>Informações Básicas</h2>
        <form id="form-cadastro">
            <label for="name">Nome:</label>
            <input type="text" id="name" placeholder="Digite aqui o nome" required>

            <label for="cnpj">CNPJ:</label>
            <input type="text" id="cnpj" placeholder="Digite aqui o CNPJ" required>

            <label for="phone">Telefone:</label>
            <input type="text" id="phone" placeholder="Digite aqui o telefone" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite o e-mail da empresa">

            <label for="website">Site da Empresa:</label>
            <input type="text" id="website" placeholder="(Opcional) Digite a URL da empresa">

            <input type="submit" value="Cadastrar" class="btn-cadastrar">
        </form>
    </div>

    <div id="fornecedores-lista" class="fornecedores-lista"></div>

    <footer>
        <p>Todos os direitos reservados &copy; 2024</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
